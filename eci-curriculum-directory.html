<style>

    --paper: #F5F2EC;
    --paper-raised: #FCFAF6;
    --ink: #262A2E;
    --ink-muted: #63666B;
    --rule: #DED8C9;
    --rule-strong: #C9C1AC;
    --chip-bg: #FCFAF6;
    --focus: #2B6CB0;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --charcoal: #EDEAE3;
      --charcoal-soft: #C7C2B8;
      --maple: #E1546A;
      --maple-deep: #F0899A;
      --gold: #D9A25E;
      --paper: #1B1D1F;
      --paper-raised: #242628;
      --ink: #EDEAE3;
      --ink-muted: #9C9891;
      --rule: #3A3C3D;
      --rule-strong: #4B4D4E;
      --chip-bg: #242628;
    }
  }
  :root[data-theme="dark"]{
    --charcoal: #EDEAE3;
    --charcoal-soft: #C7C2B8;
    --maple: #E1546A;
    --maple-deep: #F0899A;
    --gold: #D9A25E;
    --paper: #1B1D1F;
    --paper-raised: #242628;
    --ink: #EDEAE3;
    --ink-muted: #9C9891;
    --rule: #3A3C3D;
    --rule-strong: #4B4D4E;
    --chip-bg: #242628;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Libre Franklin', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  a{ color: inherit; }

  /* ---------- header ---------- */
  header{
    border-bottom: 1px solid var(--rule);
    padding: 22px clamp(16px, 4vw, 40px) 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    justify-content: space-between;
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand-block{ min-width: 240px; }
  .eyebrow{
    font-size: 12.5px;
    color: var(--ink-muted);
    letter-spacing: 0.01em;
    margin: 0 0 4px;
  }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(24px, 3.4vw, 32px);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .header-controls{
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap{
    position: relative;
  }
  #search{
    font-family: inherit;
    font-size: 14px;
    padding: 9px 14px 9px 34px;
    width: 260px;
    max-width: 60vw;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    background: var(--paper-raised);
    color: var(--ink);
  }
  #search:focus-visible{ outline: 2px solid var(--focus); outline-offset: 1px; }
  .search-wrap svg{
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    stroke: var(--ink-muted);
    pointer-events: none;
  }
  .lang-toggle{
    display: flex;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    overflow: hidden;
  }
  .lang-toggle button{
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 13px;
    background: var(--paper-raised);
    color: var(--ink-muted);
    border: none;
    cursor: pointer;
  }
  .lang-toggle button + button{ border-left: 1px solid var(--rule-strong); }
  .lang-toggle button[aria-pressed="true"]{
    background: var(--maple);
    color: #FCFAF6;
  }
  .lang-toggle button:focus-visible{ outline: 2px solid var(--focus); outline-offset: -2px; }

  /* ---------- layout ---------- */
  .layout{
    display: grid;
    grid-template-columns: 200px 1fr;
    max-width: 1180px;
    margin: 0 auto;
  }
  nav.grade-rail{
    border-right: 1px solid var(--rule);
    padding: 22px 10px 40px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    position: sticky;
    top: 79px;
    align-self: start;
    max-height: calc(100vh - 79px);
    overflow-y: auto;
  }
  nav.grade-rail button{
    font-family: inherit;
    text-align: left;
    background: none;
    border: none;
    border-left: 3px solid transparent;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--ink-muted);
    cursor: pointer;
    border-radius: 0 3px 3px 0;
  }
  nav.grade-rail button:hover{ background: var(--paper-raised); color: var(--ink); }
  nav.grade-rail button[aria-current="true"]{
    border-left-color: var(--maple);
    color: var(--ink);
    font-weight: 600;
    background: var(--paper-raised);
  }
  nav.grade-rail button:focus-visible{ outline: 2px solid var(--focus); outline-offset: -2px; }

  main{
    padding: 30px clamp(16px, 4vw, 40px) 80px;
    min-width: 0;
  }

  .mode-label{
    font-size: 12.5px;
    color: var(--ink-muted);
    margin: 0 0 22px;
  }
  .mode-label b{ color: var(--ink); font-weight: 600; }

  h2.grade-heading{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 22px;
  }

  section.subject{
    border-top: 1px solid var(--rule);
    padding: 20px 0 6px;
  }
  section.subject:first-of-type{ border-top: none; padding-top: 0; }
  h3.subject-name{
    font-family: 'Fraunces', serif;
    font-size: 16.5px;
    font-weight: 600;
    color: var(--maple-deep);
    margin: 0 0 14px;
  }
  h3.subject-name .grade-tag{
    font-family: 'Libre Franklin', sans-serif;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-muted);
    margin-left: 8px;
  }

  article.topic{
    padding-left: 14px;
    border-left: 2px solid var(--rule);
    margin-bottom: 18px;
  }
  article.topic:last-child{ margin-bottom: 4px; }
  p.topic-title{
    margin: 0 0 9px;
    font-size: 14.5px;
    color: var(--ink);
  }
  ul.link-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  ul.link-list a{
    display: inline-block;
    font-size: 12.5px;
    text-decoration: none;
    padding: 5px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    background: var(--chip-bg);
    color: var(--charcoal-soft);
  }
  ul.link-list a:hover{
    background: var(--charcoal);
    color: var(--paper);
    border-color: var(--charcoal);
  }
  ul.link-list a:focus-visible{ outline: 2px solid var(--focus); outline-offset: 1px; }

  .empty-state{
    padding: 40px 0;
    color: var(--ink-muted);
    font-size: 14.5px;
    max-width: 46ch;
  }
  .empty-state b{ color: var(--ink); }

  @media (max-width: 760px){
    .layout{ display: block; }
    nav.grade-rail{
      position: static;
      flex-direction: row;
      overflow-x: auto;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--rule);
      padding: 12px clamp(16px,4vw,40px);
      gap: 4px;
    }
    nav.grade-rail button{
      white-space: nowrap;
      border-left: none;
      border-bottom: 3px solid transparent;
      border-radius: 3px 3px 0 0;
    }
    nav.grade-rail button[aria-current="true"]{
      border-left-color: transparent;
      border-bottom-color: var(--maple);
    }
    #search{ width: 100%; max-width: none; }
    header{ align-items: stretch; }
    .header-controls{ justify-content: space-between; }
  }
</style>

    eyebrow: "École Canadienne Internationale de Paris",
    title: "Curriculum Resource Directory",
    searchPlaceholder: "Search all grades…",
    searchingAll: "Showing results for",
    browsing: "Browsing",
    emptyTitle: "No resources found",
    emptyBody: q => `Nothing matched “${q}” across any grade. Try a different subject, topic, or resource name.`,
    resultsIn: "in"
  },
  fr: {
    eyebrow: "École Canadienne Internationale de Paris",
    title: "Répertoire de ressources pédagogiques",
    searchPlaceholder: "Rechercher dans tous les niveaux…",
    searchingAll: "Résultats pour",
    browsing: "Consultation :",
    emptyTitle: "Aucune ressource trouvée",
    emptyBody: q => `Rien ne correspond à « ${q} » dans aucun niveau. Essayez une autre matière, un autre thème ou un autre nom de ressource.`,
    resultsIn: "—"
  }
};

let lang = "en";
let activeGrade = curriculumData[0].id;
let query = "";

try {
  const savedLang = window.localStorage.getItem("eci-curriculum-lang");
  if (savedLang === "en" || savedLang === "fr") lang = savedLang;
  const savedGrade = window.localStorage.getItem("eci-curriculum-grade");
  if (savedGrade && curriculumData.some(g => g.id === savedGrade)) activeGrade = savedGrade;
} catch (e) { /* storage unavailable — defaults stand */ }

const gradeRail = document.getElementById("gradeRail");
const content = document.getElementById("content");
const searchInput = document.getElementById("search");
const btnEn = document.getElementById("btnEn");
const btnFr = document.getElementById("btnFr");

function persist(key, value){
  try { window.localStorage.setItem(key, value); } catch (e) { /* ignore */ }
}

function norm(s){
  return (s || "").toLowerCase();
}

function buildRail(){
  gradeRail.innerHTML = "";
  curriculumData.forEach(g => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = g.grade[lang];
    btn.setAttribute("aria-current", g.id === activeGrade ? "true" : "false");
    btn.addEventListener("click", () => {
      activeGrade = g.id;
      persist("eci-curriculum-grade", activeGrade);
      searchInput.value = "";
      query = "";
      render();
    });
    gradeRail.appendChild(btn);
  });
}

function linkChip(link){
  const a = document.createElement("a");
  a.href = link.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = link.name;
  return a;
}

function topicBlock(topic){
  const art = document.createElement("article");
  art.className = "topic";
  const p = document.createElement("p");
  p.className = "topic-title";
  p.textContent = topic.title[lang];
  art.appendChild(p);
  const ul = document.createElement("ul");
  ul.className = "link-list";
  topic.links.forEach(l => {
    const li = document.createElement("li");
    li.appendChild(linkChip(l));
    ul.appendChild(li);
  });
  art.appendChild(ul);
  return art;
}

function subjectMatches(subject, q){
  if (norm(subject.name[lang]).includes(q) || norm(subject.name.en).includes(q) || norm(subject.name.fr).includes(q)) return true;
  return subject.topics.some(t => topicMatches(t, q));
}

function topicMatches(topic, q){
  if (norm(topic.title[lang]).includes(q) || norm(topic.title.en).includes(q) || norm(topic.title.fr).includes(q)) return true;
  return topic.links.some(l => norm(l.name).includes(q));
}

function filteredTopic(topic, q){
  if (!q) return topic;
  if (norm(topic.title[lang]).includes(q) || norm(topic.title.en).includes(q) || norm(topic.title.fr).includes(q)) return topic;
  const links = topic.links.filter(l => norm(l.name).includes(q));
  if (links.length) return { ...topic, links };
  return null;
}

function renderBrowse(){
  const g = curriculumData.find(x => x.id === activeGrade);
  const s = STRINGS[lang];

  const modeLabel = document.createElement("p");
  modeLabel.className = "mode-label";
  modeLabel.innerHTML = "";
  const modeText = document.createElement("span");
  modeText.textContent = s.browsing + " ";
  const modeBold = document.createElement("b");
  modeBold.textContent = g.grade[lang];
  modeLabel.appendChild(modeText);
  modeLabel.appendChild(modeBold);
  content.appendChild(modeLabel);

  g.subjects.forEach(subject => {
    const section = document.createElement("section");
    section.className = "subject";
    const h3 = document.createElement("h3");
    h3.className = "subject-name";
    h3.textContent = subject.name[lang];
    section.appendChild(h3);
    subject.topics.forEach(topic => section.appendChild(topicBlock(topic)));
    content.appendChild(section);
  });
}

function renderSearch(q){
  const s = STRINGS[lang];
  const nq = norm(q);

  const modeLabel = document.createElement("p");
  modeLabel.className = "mode-label";
  const modeText = document.createElement("span");
  modeText.textContent = s.searchingAll + " ";
  const modeBold = document.createElement("b");
  modeBold.textContent = `“${q}”`;
  modeLabel.appendChild(modeText);
  modeLabel.appendChild(modeBold);
  content.appendChild(modeLabel);

  let anyResults = false;

  curriculumData.forEach(g => {
    const matchingSubjects = g.subjects
      .map(subject => {
        const matchedTopics = subject.topics
          .map(t => filteredTopic(t, nq))
          .filter(Boolean);
        const nameMatches = norm(subject.name[lang]).includes(nq) || norm(subject.name.en).includes(nq) || norm(subject.name.fr).includes(nq);
        if (matchedTopics.length === 0 && !nameMatches) return null;
        return { ...subject, topics: nameMatches && matchedTopics.length === 0 ? subject.topics : matchedTopics };
      })
      .filter(Boolean);

    if (matchingSubjects.length === 0) return;
    anyResults = true;

    const section = document.createElement("section");
    section.className = "subject";
    matchingSubjects.forEach(subject => {
      const h3 = document.createElement("h3");
      h3.className = "subject-name";
      h3.textContent = subject.name[lang];
      const tag = document.createElement("span");
      tag.className = "grade-tag";
      tag.textContent = "· " + g.grade[lang];
      h3.appendChild(tag);
      section.appendChild(h3);
      subject.topics.forEach(topic => section.appendChild(topicBlock(topic)));
    });
    content.appendChild(section);
  });

  if (!anyResults){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    const b = document.createElement("b");
    b.textContent = s.emptyTitle;
    const body = document.createElement("p");
    body.textContent = s.emptyBody(q);
    empty.appendChild(b);
    empty.appendChild(document.createElement("br"));
    empty.appendChild(body);
    content.appendChild(empty);
  }
}

function render(){
  document.getElementById("eyebrow").textContent = STRINGS[lang].eyebrow;
  document.getElementById("pageTitle").textContent = STRINGS[lang].title;
  document.title = STRINGS[lang].title + " — ECI";
  searchInput.placeholder = STRINGS[lang].searchPlaceholder;
  document.documentElement.lang = lang;

  buildRail();
  content.innerHTML = "";
  if (query.trim().length > 0){
    renderSearch(query.trim());
  } else {
    renderBrowse();
  }
}

searchInput.addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

btnEn.addEventListener("click", () => {
  lang = "en";
  persist("eci-curriculum-lang", lang);
  btnEn.setAttribute("aria-pressed", "true");
  btnFr.setAttribute("aria-pressed", "false");
  render();
});
btnFr.addEventListener("click", () => {
  lang = "fr";
  persist("eci-curriculum-lang", lang);
  btnFr.setAttribute("aria-pressed", "true");
  btnEn.setAttribute("aria-pressed", "false");
  render();
});
if (lang === "fr"){
  btnFr.setAttribute("aria-pressed", "true");
  btnEn.setAttribute("aria-pressed", "false");
}
